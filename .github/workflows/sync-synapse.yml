name: Sync @enhans/synapse

# viralpick/synapse 가 npm 퍼블리시되면 repository_dispatch(synapse-released)로
# 이 워크플로우가 트리거되어 의존성 버전을 올린 PR을 만든다.
# 수동 실행(workflow_dispatch)으로도 특정 버전을 지정해 돌릴 수 있다.
on:
  repository_dispatch:
    types: [synapse-released]
  workflow_dispatch:
    inputs:
      version:
        description: "설치할 @enhans/synapse 버전 (비우면 npm latest)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# 릴리스가 연달아 나도 PR 생성이 서로 밟지 않도록 직렬화
concurrency: sync-synapse

jobs:
  sync:
    name: Bump @enhans/synapse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Resolve target version
        id: resolve
        run: |
          TARGET="${{ github.event.client_payload.version || inputs.version }}"
          if [ -z "$TARGET" ]; then
            TARGET=$(npm view @enhans/synapse version)
            echo "버전이 전달되지 않아 npm latest를 사용합니다: $TARGET"
          fi

          CURRENT=$(node -p "require('./package.json').dependencies['@enhans/synapse']")

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "^$TARGET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::이미 ^$TARGET 을 사용 중이므로 종료합니다."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$CURRENT → ^$TARGET 으로 올립니다."
          fi

      - name: Install dependencies
        if: steps.resolve.outputs.skip == 'false'
        run: npm ci

      - name: Bump @enhans/synapse
        if: steps.resolve.outputs.skip == 'false'
        run: npm install "@enhans/synapse@${{ steps.resolve.outputs.target }}"

      # 실패해도 PR은 올린다. 0.x minor 릴리스는 breaking change를 포함할 수 있어
      # 사람이 판단할 근거가 필요하고, 검증 결과는 PR 본문에 기록된다.
      - name: Verify (lint + build)
        id: verify
        if: steps.resolve.outputs.skip == 'false'
        continue-on-error: true
        run: npm run verify

      - name: Create or update PR
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.resolve.outputs.target }}
          CURRENT: ${{ steps.resolve.outputs.current }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "::notice::package.json / package-lock.json 변경이 없어 종료합니다."
            exit 0
          fi

          BRANCH="chore/synapse-${TARGET}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): @enhans/synapse ${CURRENT} → ^${TARGET}"
          git push --force -u origin "$BRANCH"

          if [ "$VERIFY" = "success" ]; then
            VERIFY_LINE='✅ `npm run verify` (oxlint + vite build) 통과'
          else
            VERIFY_LINE='⚠️ `npm run verify` **실패** — 머지 전에 확인이 필요합니다. Actions 로그를 봐주세요.'
          fi

          BODY=$(cat <<EOF
          ## @enhans/synapse ${CURRENT} → \`^${TARGET}\`

          [viralpick/synapse](https://github.com/viralpick/synapse) 릴리스 감지로 자동 생성된 PR입니다.

          ### 검증
          ${VERIFY_LINE}

          ### 참고
          - [CHANGELOG](https://github.com/viralpick/synapse/blob/main/CHANGELOG.md)
          - [npm @enhans/synapse](https://www.npmjs.com/package/@enhans/synapse)

          > \`@enhans/synapse\`는 0.x 버전이라 minor 업데이트에도 breaking change가 있을 수 있습니다. 검증이 통과했어도 변경 로그를 확인하고 머지해 주세요.
          EOF
          )

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body "$BODY"
            echo "::notice::기존 PR을 업데이트했습니다."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(deps): @enhans/synapse ${CURRENT} → ^${TARGET}" \
              --body "$BODY"
          fi
