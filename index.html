<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' http://localhost:8080 https://*.commerceos.ai https://*.enhans.ai https://*.azure.lge.co.kr http://*.azure.lge.co.kr http://dapi.kakao.com https://t1.daumcdn.net http://t1.daumcdn.net https://openapi.map.naver.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' http://*.daumcdn.net data: https:;
        font-src 'self' data:;
        connect-src 'self' http://localhost:8080 http://localhost:* ws://localhost:* https://*.commerceos.ai wss://*.commerceos.ai https://*.enhans.ai wss://*.enhans.ai https://*.lghnh.enhans.ai wss://*.lghnh.enhans.ai http://*.lghnh.enhans.ai ws://*.lghnh.enhans.ai http://*.azure.lge.co.kr ws://*.azure.lge.co.kr http://*.atlas.lge.com ws://*.atlas.lge.com https://*.kakao.com https://*.daumcdn.net https://*.naver.com https://*.ngrok-free.dev;
        base-uri 'self';
        form-action 'self';
      "
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- index.css 는 main.tsx 에서 import 한다. `<link>` 로 물면 Vite dev 에서
         CSS 가 JS 모듈 그래프에 들어가지 않아, @import 된 theme.css 변경이
         `[no modules matched]` 로 무시된다 → 앱빌더가 theme.css 를 교체해도
         리로드 없이는 화면에 반영되지 않는다. (AOS-3962)
         본문이 빈 셸(#root)뿐이라 link 를 떼도 FOUC 대상이 없다. -->
    <title>cos-vibe-app-vite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
